<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>40k Headquarters - Admin</title>
  </head>
  <body>
    <div class="admin-shell">
      <header class="admin-topbar">
        <div>
          <h1>40k HQ Admin</h1>
          <p id="statusLine">Not authenticated</p>
        </div>
        <a class="back-link" href="/">Back To Game</a>
      </header>

      <main class="admin-workspace">
        <section class="panel auth-panel">
          <h2>Authentication</h2>
          <label for="loginUser">Username</label>
          <input id="loginUser" autocomplete="username" />
          <label for="loginPass">Password</label>
          <input id="loginPass" type="password" autocomplete="current-password" />
          <div class="row">
            <button id="loginBtn">Login</button>
            <button id="logoutBtn" class="ghost">Logout</button>
          </div>
          <p id="authLine">Not logged in</p>
          <p class="hint">Use an admin account configured on the server.</p>
        </section>

        <section id="resourceConversionPanel" class="panel hidden">
          <h2>Product Conversion</h2>
          <p class="hint">Product output from one unit of its recipe resource.</p>
          <div id="resourceConversionRates" class="resource-editor"></div>
          <button id="saveResourceConversionBtn">Save Conversion Rates</button>
        </section>

        <section id="adminPanel" class="panel hidden">
          <h2>Players</h2>
          <div class="grid add-grid">
            <div>
              <label for="addPlayerId">Player ID (automatic)</label>
              <input id="addPlayerId" placeholder="assigned automatically" disabled />
            </div>
            <div>
              <label for="addPlayerName">Name</label>
              <input id="addPlayerName" placeholder="name" />
            </div>
            <div>
              <label for="addPlayerColor">Unit color</label>
              <input id="addPlayerColor" type="color" value="#63d6ff" />
            </div>
            <div>
              <label for="addPlayerUsername">Username</label>
              <input id="addPlayerUsername" placeholder="username (optional)" />
            </div>
            <div>
              <label for="addPlayerPassword">Password</label>
              <input id="addPlayerPassword" placeholder="password (optional)" />
            </div>
            <div>
              <label for="addPlayerAlignment">Alignment</label>
              <select id="addPlayerAlignment">
                <option value="NON_IMPERIAL">NON_IMPERIAL</option>
                <option value="IMPERIAL">IMPERIAL</option>
              </select>
            </div>
            <div>
              <label for="addPlayerFaction">Faction</label>
              <select id="addPlayerFaction"></select>
            </div>
            <div>
              <label for="addPlayerCanTakeResources">May take planet resources</label>
              <input id="addPlayerCanTakeResources" type="checkbox" />
            </div>
          </div>
          <button id="addPlayerBtn">Add Player</button>
          <input id="playersSearch" placeholder="Quick search players..." />
          <div id="playersList" class="list"></div>
        </section>

        <section id="factionsPanel" class="panel hidden">
          <h2>Factions</h2>
          <div class="grid add-grid">
            <div>
              <label for="addFactionId">Faction Code</label>
              <input id="addFactionId" placeholder="faction id" />
            </div>
            <div>
              <label for="addFactionName">Faction Name</label>
              <input id="addFactionName" placeholder="faction name" />
            </div>
            <div>
              <label for="addFactionDescription">Description</label>
              <input id="addFactionDescription" placeholder="description (optional)" />
            </div>
          </div>
          <button id="addFactionBtn">Add Faction</button>
          <input id="factionsSearch" placeholder="Quick search factions..." />
          <div id="factionsList" class="list"></div>
        </section>

        <section id="planetsPanel" class="panel hidden">
          <h2>Planets</h2>
          <div class="grid add-grid">
            <div>
              <label for="addPlanetId">Planet ID (automatic)</label>
              <input id="addPlanetId" placeholder="assigned automatically" disabled />
            </div>
            <div>
              <label for="addPlanetName">Planet Name</label>
              <input id="addPlanetName" placeholder="planet name" />
            </div>
            <div>
              <label for="addPlanetQ">Q</label>
              <input id="addPlanetQ" type="number" placeholder="q" />
            </div>
            <div>
              <label for="addPlanetR">R</label>
              <input id="addPlanetR" type="number" placeholder="r" />
            </div>
            <div>
              <label for="addPlanetWorldType">World Type</label>
              <select id="addPlanetWorldType"></select>
            </div>
            <div>
              <label>World Tags</label>
              <div id="addPlanetWorldTags" class="chip-selector" role="group"></div>
            </div>
            <div>
              <label for="addPlanetPopulation">Population</label>
              <input id="addPlanetPopulation" type="number" placeholder="population" value="60" />
            </div>
            <div>
              <label for="addPlanetMorale">Morale</label>
              <input id="addPlanetMorale" type="number" placeholder="morale" value="5" />
            </div>
            <div>
              <label for="addPlanetTitheLevel">Tithe Level</label>
              <select id="addPlanetTitheLevel"></select>
            </div>
            <div>
              <label for="addPlanetMaxTitheLevel">Maximum Tithe Level</label>
              <select id="addPlanetMaxTitheLevel"></select>
            </div>
            <div>
              <label for="addPlanetTithePaid">Tithe Paid</label>
              <input id="addPlanetTithePaid" type="number" placeholder="tithePaid" value="0" />
            </div>
            <div>
              <label for="addPlanetInf">Influence Value</label>
              <input id="addPlanetInf" type="number" placeholder="influenceValue" value="1" />
            </div>
            <div>
              <label for="addPlanetVision">Vision Range</label>
              <input id="addPlanetVision" type="number" placeholder="visionRange" value="1" />
            </div>
            <div>
              <label for="addPlanetOverview">Overview Range</label>
              <input id="addPlanetOverview" type="number" placeholder="overviewRange" value="1" />
            </div>
            <div>
              <label>Generated Resources</label>
              <div id="addPlanetGeneration" class="chip-selector" role="group"></div>
            </div>
            <div class="resource-list-field">
              <label>Current Resources</label>
              <div id="addPlanetRawStock" class="resource-editor"></div>
            </div>
          </div>
          <button id="addPlanetBtn">Add Planet</button>
          <input id="planetsSearch" placeholder="Quick search planets..." />
          <div id="planetsList" class="list"></div>
        </section>

        <section id="fleetsPanel" class="panel hidden">
          <h2>Fleets</h2>
          <div class="grid add-grid">
            <div>
              <label for="addFleetId">Fleet ID (automatic)</label>
              <input id="addFleetId" placeholder="assigned automatically" disabled />
            </div>
            <div>
              <label for="addFleetOwner">Owner Player ID</label>
              <select id="addFleetOwner"></select>
            </div>
            <div>
              <label for="addFleetQ">Q</label>
              <input id="addFleetQ" type="number" placeholder="q" />
            </div>
            <div>
              <label for="addFleetR">R</label>
              <input id="addFleetR" type="number" placeholder="r" />
            </div>
            <div>
              <label for="addFleetPower">Combat Power</label>
              <input id="addFleetPower" type="number" placeholder="combatPower" value="10" />
            </div>
            <div>
              <label for="addFleetHealth">Health</label>
              <input id="addFleetHealth" type="number" placeholder="health" value="100" />
            </div>
            <div>
              <label for="addFleetInfluence">Influence</label>
              <input id="addFleetInfluence" type="number" placeholder="influence" value="5" />
            </div>
            <div>
              <label for="addFleetAp">Action Points</label>
              <input id="addFleetAp" type="number" placeholder="actionPoints" value="3" />
            </div>
            <div>
              <label for="addFleetVision">Vision Range</label>
              <input id="addFleetVision" type="number" placeholder="visionRange" value="2" />
            </div>
            <div>
              <label for="addFleetCapacity">Capacity</label>
              <input id="addFleetCapacity" type="number" placeholder="capacity" value="10" />
            </div>
            <div>
              <label for="addFleetStance">Stance</label>
              <select id="addFleetStance">
                <option value="ATTACK">ATTACK</option>
                <option value="DEFENSE">DEFENSE</option>
              </select>
            </div>
            <div>
              <label for="addFleetInventory">Inventory JSON</label>
              <input id="addFleetInventory" placeholder='{"ORE":3}' />
            </div>
          </div>
          <button id="addFleetBtn">Add Fleet</button>
          <input id="fleetsSearch" placeholder="Quick search fleets..." />
          <div id="fleetsList" class="list"></div>
        </section>

        <section id="armiesPanel" class="panel hidden">
          <h2>Armies</h2>
          <div class="grid add-grid">
            <div>
              <label for="addArmyOwner">Owner Player</label>
              <select id="addArmyOwner"></select>
            </div>
            <div>
              <label for="addArmyDestinationKind">Placement</label>
              <select id="addArmyDestinationKind">
                <option value="PLANET">Planet</option>
                <option value="FLEET">Fleet</option>
              </select>
            </div>
            <div>
              <label for="addArmyDestination">Destination</label>
              <select id="addArmyDestination"></select>
            </div>
            <div>
              <label for="addArmyPower">Combat Power</label>
              <input id="addArmyPower" type="number" value="10" min="0" />
            </div>
            <div>
              <label for="addArmyHealth">Health</label>
              <input id="addArmyHealth" type="number" value="100" min="1" />
            </div>
            <div>
              <label for="addArmyInfluence">Influence</label>
              <input id="addArmyInfluence" type="number" value="5" min="0" />
            </div>
            <div>
              <label for="addArmyVision">Vision Range</label>
              <input id="addArmyVision" type="number" value="1" min="0" />
            </div>
            <div>
              <label for="addArmyStance">Stance</label>
              <select id="addArmyStance">
                <option value="ATTACK">ATTACK</option>
                <option value="DEFENSE">DEFENSE</option>
              </select>
            </div>
          </div>
          <button id="addArmyBtn">Add Army</button>
          <input id="armiesSearch" placeholder="Quick search armies..." />
          <div id="armiesList" class="list"></div>
        </section>

        <section id="relationsPanel" class="panel hidden">
          <h2>Relations</h2>
          <div class="row">
            <div>
              <label for="relType">Relation Type</label>
              <select id="relType">
                <option value="ALLIANCE">ALLIANCE</option>
                <option value="WAR">WAR</option>
              </select>
            </div>
            <div>
              <label for="relPlayerA">Player A ID</label>
              <select id="relPlayerA"></select>
            </div>
            <div>
              <label for="relPlayerB">Player B ID</label>
              <select id="relPlayerB"></select>
            </div>
          </div>
          <div class="row">
            <button id="addRelationBtn">Add Relation</button>
            <button id="removeRelationBtn" class="danger">Remove Relation</button>
          </div>
          <input id="relationsSearch" placeholder="Quick search relations..." />
          <div class="relations-wrap">
            <div>
              <h3>Alliances</h3>
              <ul id="alliancesList"></ul>
            </div>
            <div>
              <h3>Wars</h3>
              <ul id="warsList"></ul>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2>Events</h2>
          <pre id="eventsLog"></pre>
        </section>
      </main>
    </div>

    <script type="module" src="/src/admin.ts"></script>
  </body>
</html>
